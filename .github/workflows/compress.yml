name: Compress

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    if: github.repository == 'doocs/advanced-java'
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v3

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true

      - name: Commit Files
        if: |
          steps.calibre.outputs.markdown != ''
        run: |
          git config --local user.email "szuyanglb@outlook.com"
          git config --local user.name "yanglbme"
          git commit -m "chore: auto compress images" -a

      - name: Push Changes
        if: |
          steps.calibre.outputs.markdown != ''
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secirets.GITHUB_TOKEN }}



                      - name: Coverage Upload Action
  # You may pin to the exact commit or the version.
  # uses: neofinancial/coverage-upload-action@a77f313d80effa4cc9ecc4cdacd12b3ee8ff8301
  uses: neofinancial/coverage-upload-action@v2.0.0
  with:
    # location of lcov coverage file (default: coverage/lcov.info)
    coverageData: # optional, default is coverage/lcov.info
    # endpoint to send coverage to
    coverageEndpoint: # optional
    # token to send with coverage data
    coverageToken: # optional
          
